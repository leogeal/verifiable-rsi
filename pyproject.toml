[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srsi"
version = "0.1.0"
description = "Sandboxed Recursive Self-Improvement: an integrity-first self-improving research harness for theorem proving, mathematics, and physics."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
srsi = "srsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
